name: backfill-releases
# One-shot: create GitHub Releases for tags that were published to npm
# before the release workflow learned to create them. Runs when this file
# is pushed; the file is removed afterwards.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-releases.yml']
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tail -n +2 docs/release-notes-v0.2.0.md > /tmp/notes.md
            gh release create v0.2.0 --repo "$GITHUB_REPOSITORY" --title "v0.2.0 — diff mode: the drift alarm" --notes-file /tmp/notes.md
          fi
          if ! gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.1 --repo "$GITHUB_REPOSITORY" --title "v0.1.1 — npm page refresh, provenance publishing" --notes "README refresh on the npm page (badges, terminal render), homepage now points at https://atomburst.io/geiger, and releases are published from GitHub Actions with npm provenance from this version on."
          fi
